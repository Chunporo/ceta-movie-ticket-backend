# One VM, three containers: MySQL, the backend, and Caddy (HTTPS with an automatic Let's Encrypt certificate).
# Usage: copy .env.example to .env, fill it in, then `docker compose up -d --build` from this folder.
services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ceta
      MYSQL_USER: ceta
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=256M"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:mysql://db:3306/ceta?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USER: ceta
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_BASE_URL: https://${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ceta.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  dbdata:
  caddydata:
