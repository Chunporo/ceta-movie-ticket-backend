services:
  - type: web
    name: ceta-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/movies
    envVars:
      - { key: SPRING_PROFILES_ACTIVE, value: prod }
      - { key: DATABASE_URL, sync: false }
      - { key: DATABASE_USER, sync: false }
      - { key: DATABASE_PASSWORD, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: ADMIN_EMAIL, value: admin@ceta.app }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: VNPAY_TMN_CODE, sync: false }
      - { key: VNPAY_HASH_SECRET, sync: false }
