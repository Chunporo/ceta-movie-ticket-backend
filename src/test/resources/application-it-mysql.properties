# Real MySQL for lock tests (H2 cannot emulate FOR UPDATE). Used with -Pit-mysql.
spring.datasource.url=${IT_MYSQL_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${IT_MYSQL_USER:root}
spring.datasource.password=${IT_MYSQL_PASSWORD:root}
spring.datasource.hikari.maximum-pool-size=60
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
