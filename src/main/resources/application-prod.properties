# Production profile. Everything secret comes from environment variables; nothing here is a real credential.
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=1209600

# First admin account: only created when ADMIN_PASSWORD is set (and then ADMIN_EMAIL, default admin@ceta.app, is the login).
app.seed.admin-email=${ADMIN_EMAIL:admin@ceta.app}
app.seed.admin-password=${ADMIN_PASSWORD:}

# Payments: sandbox merchant values, set per host. VNPay is always offered, MoMo and VietQR only when their values are set.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${PUBLIC_BASE_URL}/api/v1/payments/vnpay/return

# No public API explorer in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
