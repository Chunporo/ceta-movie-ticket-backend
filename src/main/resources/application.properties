spring.application.name=ceta-backend
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.booking.hold-enabled=true
app.booking.hold-ttl=10m
app.booking.max-seats-per-booking=8
app.booking.max-attempts-per-showtime-per-hour=3
app.booking.sweeper-interval=20s
app.payment.return-claim=true
app.payment.return-deep-link=ceta://payment/result
app.ticket.checkin-opens-before=60m
app.booking.cancel-before=60m
# Accounts (US-01, US-03)
app.auth.max-failed-logins=5
app.auth.lock-duration=1m
app.auth.reset-ttl=30m
app.auth.reset-cooldown=60s
app.auth.reset-link-template=ceta://reset-password?token=%s
app.timezone=Asia/Ho_Chi_Minh

# Notifications (S14)
app.notification.reminder-before=2h
app.notification.reminder-interval=5m

# Firebase Authentication: the app signs in with Firebase, then trades the ID token at POST /api/v1/auth/firebase.
app.firebase.project-id=ceta-dedff
